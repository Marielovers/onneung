<script>
'use strict';

const QUESTIONS = [
  { text:'온리리온의 방송 시작 시간은?', options:['18시','19시','20시','몰?루'], correct:[3]},

  { text:'온리리온의 남표니 이름은?', options:['시온 더 다크불릿','시온덜크','B급 뮤직','편순이'], correct:[1]},

  { text:'온리리온의 남표니가 사용하는 캐릭터, 맨다몬의 어원은 어디서 왔는가?', options:['음식','동물','꽃','트릭컬'], correct:[0], note:'맨다몬의 어원은 만두와 즌다몬이다.'},
  { text:'온리리온이 과거 좋아했던 캐릭터의 이름은?', options:['소피 농이왼물려','라이잘린 스타우트','리온하르트','소피 노이엔뮐러'], correct:[3], image:true},
  { text:'다음 중 온리 방송 밈으로 알맞지 않은 것은?', options:['무음이별이 들리면 (화남) 이모지를 사용','장문글',"아무때나 '감사합니다' '사랑합니다'를 쓰기",'질투','고백'], correct:[2]},
  { text:'온리리온은', options:['처녀다','비처녀다'], correct:[0]},
  { text:'온리리온은', options:['남자다','여자다'], correct:[0,1], gimmick:'runaway'}
];
const SOPHIE_IMAGE = 'https://www.koeitecmoamerica.com/sophie2/img/products/img_bonus05%40sp.png';
const SOPHIE_SOURCE = 'https://www.koeitecmoamerica.com/sophie/';
const app=document.getElementById('app');
const alphabet=['A','B','C','D','E'];
let state={phase:'start',index:0,score:0,locked:false,selected:new Set(),results:[],startTime:null,endTime:null,evades:0};
let intervalId=null;
function el(tag,cls,content){const x=document.createElement(tag);if(cls)x.className=cls;if(content!=null)x.textContent=content;return x}
function pad(n){return String(n).padStart(2,'0')}
function formattedTime(){let secs=Math.max(0,Math.floor(((state.endTime||Date.now())-(state.startTime||Date.now()))/1000));return `${pad(Math.floor(secs/60))}:${pad(secs%60)}`}
function randomEmailOptions(){
  // 플레이마다 오답 3개의 순서와 철자가 조금씩 달라집니다. 실제 정답만 고정.
  const pool=['9neuen8','9neuen0','9neuen7','9neuen99','9neuen_9','9neuenn9','9neuen09','9neuem9','9neueen9','9neun9','neuen9','9neuen6'];
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  return ['9neuen9@naver.com',...pool.slice(0,3).map(s=>s+'@naver.com')];
}
function makeButton(label,cls,fn){const b=el('button','btn '+cls,label);b.type='button';if(fn)b.addEventListener('click',fn);return b}

function startShell(){const paper=el('section','paper fade');paper.appendChild(el('div','top-strip'));app.replaceChildren(paper);return paper}
function renderStart(){const paper=startShell();const cover=el('div','cover');cover.innerHTML=`<span class="pill">✦ 공식 아님 · 진심임</span><h1>온리리온<br><span>능력 평가 시험</span></h1><p class="lead">아는 만큼 맞히세요.<br>정답을 골라 온리리온 지식을 증명하세요.</p><div class="facts"><div class="fact">총 17문항</div><div class="fact">객관식 평가</div><div class="fact">시간 제한 없음</div></div><div class="exam-notice"><strong>응시 안내</strong><br>일부 문항은 정답이 여러 개일 수 있습니다. 특별히 ‘2개 선택’이라고 표시된 문항만 두 보기를 고른 뒤 제출하세요. 정답은 각 문항 제출 후 공개됩니다.</div>`;
  const row=el('div','start-row');const acts=el('div','start-actions');acts.append(makeButton('시험 시작하기  →','btn-primary',begin));if(location.protocol==='https:'||location.protocol==='http:')acts.append(makeButton('시험 링크 복사','btn-subtle',shareLink));row.append(el('div','tiny','수험번호는 없습니다. 여러분이 알아서 잘 보세요.'),acts);cover.append(row);paper.append(cover)}
function renderQuestion(){state.locked=false;state.selected=new Set();state.evades=0;const q=QUESTIONS[state.index],paper=startShell();const quiz=el('div','quiz');
  const bar=el('div','exam-bar');bar.innerHTML=`<span>OLAT · <strong>KNOW YOUR ONLYLION</strong></span><span class="stepcount">${pad(state.index+1)} / ${QUESTIONS.length} &nbsp; · &nbsp; <span id="elapsed">${formattedTime()}</span></span>`;quiz.append(bar);
  const progress=el('div','progress'),progressFill=el('span');progressFill.style.width=(state.index/QUESTIONS.length*100)+'%';progress.append(progressFill);quiz.append(progress);
  const kicker=el('div','q-kicker');kicker.append(el('span','qnum',`QUESTION ${pad(state.index+1)}`),el('span','qtype',q.multi?'복수 선택 · 정확히 2개':'단일 선택'));quiz.append(kicker);
  const h=el('h2','question',q.text);quiz.append(h);
  const area=el('div','answerarea');area.id='answerarea';quiz.append(area);paper.append(quiz);
  if(q.gimmick==='runaway')renderRunaway(area,q);else renderOptions(area,q);
}
function renderOptions(area,q){const grid=el('div','optiongrid');q.options.forEach((answer,i)=>{
    const btn=el('button','option');btn.type='button';btn.dataset.index=String(i);const letter=el('span','opt-letter',alphabet[i]);btn.append(letter,el('span','opt-label',answer));
    btn.addEventListener('click',()=>{if(state.locked)return;if(q.multi)toggleMulti(i,btn);else finishAnswer([i])});grid.append(btn)
  });area.append(grid);
  if(q.multi){const foot=el('div','multiple-foot');const info=el('div','selected-count','0 / 2개 선택됨');info.id='selectionInfo';const submit=makeButton('답안 제출 →','btn-primary',()=>{if(!state.locked&&state.selected.size===2)finishAnswer([...state.selected])});submit.id='submitMulti';submit.disabled=true;foot.append(info,submit);area.append(foot)}
}
function toggleMulti(i,btn){if(state.selected.has(i))state.selected.delete(i);else if(state.selected.size<2)state.selected.add(i);else return;
  const grid=btn.parentElement;grid.querySelectorAll('.option').forEach((node,j)=>{node.classList.toggle('chosen',state.selected.has(j));const prev=node.querySelector('.option-check');if(prev)prev.remove();if(state.selected.has(j))node.append(el('span','option-check','✓'))});
  document.getElementById('selectionInfo').textContent=`${state.selected.size} / 2개 선택됨`;document.getElementById('submitMulti').disabled=state.selected.size!==2;
}
function renderRunaway(area,q){const stage=el('div','runway');const male=el('button','option male');male.type='button';male.tabIndex=-1;male.setAttribute('aria-label','남자다');male.append(el('span','opt-letter','A'),el('span',null,q.options[0]));
  const female=el('button','option female');female.type='button';female.dataset.index='1';female.append(el('span','opt-letter','B'),el('span',null,q.options[1]));female.addEventListener('click',()=>{if(!state.locked)finishAnswer([1])});stage.append(male,female);area.append(stage);

  function flee(clientX,clientY){if(state.locked)return;const sr=stage.getBoundingClientRect(),mr=male.getBoundingClientRect(),fr=female.getBoundingClientRect();
    const mx=clientX-sr.left,my=clientY-sr.top;const width=mr.width,height=mr.height;
    let best=null,bestScore=-Infinity;
    for(let k=0;k<30;k++){
      const x=8+Math.random()*Math.max(1,sr.width-width-18),y=8+Math.random()*Math.max(1,sr.height-height-18);
      const cx=x+width/2,cy=y+height/2;const away=Math.hypot(cx-mx,cy-my);const overlap=!(x+width<fr.left-sr.left-10||x>fr.right-sr.left+10||y+height<fr.top-sr.top-10||y>fr.bottom-sr.top+10);
      const move=Math.hypot(cx-(mr.left-sr.left+width/2),cy-(mr.top-sr.top+height/2));
      const score=away+(Math.min(move,160)*.12)-(overlap?1000:0);
      if(score>bestScore){bestScore=score;best={x,y}}
    }
    if(best){male.style.left=Math.round(best.x)+'px';male.style.top=Math.round(best.y)+'px'}
    state.evades++;
  }
  let lastFlee=0;
  stage.addEventListener('pointermove',e=>{if(state.locked||e.pointerType==='touch')return;const rect=male.getBoundingClientRect();const dist=Math.hypot(e.clientX-(rect.left+rect.width/2),e.clientY-(rect.top+rect.height/2));if(dist<Math.max(100,rect.width*.72)&&Date.now()-lastFlee>100){lastFlee=Date.now();flee(e.clientX,e.clientY)}});
  male.addEventListener('pointerenter',e=>{if(!state.locked){lastFlee=Date.now();flee(e.clientX,e.clientY)}});
  male.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(!state.locked)flee(e.clientX,e.clientY)});
  male.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(!state.locked)flee(e.clientX||0,e.clientY||0)});
}
function finishAnswer(selected){if(state.locked)return;const q=QUESTIONS[state.index];state.locked=true;
  const correct=q.multi?(selected.length===q.correct.length&&selected.every(i=>q.correct.includes(i))):(selected.length===1&&q.correct.includes(selected[0]));
  if(correct)state.score++;state.results.push({text:q.text,selected:[...selected],correct,correctOptions:[...q.correct]});
  const area=document.getElementById('answerarea');area.querySelectorAll('button.option').forEach(btn=>{
    btn.disabled=true;const i=btn.dataset.index!=null?Number(btn.dataset.index):(q.gimmick==='runaway'&&btn.classList.contains('male')?0:-1);
    if(q.correct.includes(i))btn.classList.add('good');if(selected.includes(i)&&!q.correct.includes(i))btn.classList.add('bad');
    if(selected.includes(i))btn.classList.add('chosen');
  });
  const submit=document.getElementById('submitMulti');if(submit)submit.disabled=true;
  const feedback=el('section','feedback '+(correct?'':'incorrect'));feedback.setAttribute('role','status');feedback.append(el('h3',null,correct?'✓ 정답입니다!':'✕ 오답입니다.'));
  const expected=el('p');expected.append(el('b',null,'정답: '),document.createTextNode(q.correct.map(i=>q.options[i]).join(' · ')));feedback.append(expected);
  if(q.note)feedback.append(el('p',null,q.note));
  if(q.image){const pic=el('div','image-card');const img=document.createElement('img');img.src=SOPHIE_IMAGE;img.alt='소피 노이엔뮐러 캐릭터 일러스트';img.loading='lazy';img.onerror=()=>{img.style.display='none';const fallback=el('p',null,'이미지 로딩에 실패했습니다. 아래 링크에서 확인할 수 있습니다.');pic.prepend(fallback)};
    const details=el('div','image-copy');details.append(el('b',null,'소피 노이엔뮐러 (Sophie Neuenmuller)'),el('p',null,'《소피의 아틀리에》 등장인물 · 이미지: KOEI TECMO 공식 자료'));
    const a=el('a',null,'공식 캐릭터 정보 보기 ↗');a.href=SOPHIE_SOURCE;a.target='_blank';a.rel='noopener noreferrer';details.append(a);pic.append(img,details);feedback.append(pic)}
  area.append(feedback);
  const footer=el('div','next-row');const next=makeButton(state.index===QUESTIONS.length-1?'결과 확인하기 →':'다음 문제 →','btn-primary',()=>{if(state.index===QUESTIONS.length-1)finishExam();else{state.index++;renderQuestion()}window.scrollTo({top:0,behavior:'smooth'})});footer.append(next);area.append(footer);next.focus({preventScroll:true});
}
function finishExam(){state.endTime=Date.now();clearInterval(intervalId);state.phase='end';renderEnd()}
function grade(){const s=state.score;if(s===QUESTIONS.length)return ['온리리온 명예박사','완벽합니다. 시험지가 할 말이 없네요.'];if(s>=14)return ['온리리온 우등생','상당히 잘 알고 계시네요.'];if(s>=10)return ['온리리온 애청자','제법 아는데요? 틀린 문제를 복습해 보세요.'];if(s>=5)return ['온리리온 입문자','아직 배울 온리리온이 많이 남아 있습니다.'];return ['온리리온 탐색자','이제 온리리온을 알아갈 차례입니다.']}
function renderEnd(){const paper=startShell(),end=el('div','end'),g=grade(),percent=Math.round(state.score/QUESTIONS.length*100);
  const top=el('div','result-top');top.innerHTML=`<div class="result-title">OLAT · 성적 통지서</div><div class="result-score">${percent}<small> / 100</small></div><div class="result-grade"></div><div class="result-sub"></div>`;top.querySelector('.result-grade').textContent=g[0];top.querySelector('.result-sub').textContent=g[1];end.append(top);
  const stats=el('div','statgrid');[['정답 문항',`${state.score} / ${QUESTIONS.length}`],['총 소요 시간',formattedTime()],['전체 문항',`${QUESTIONS.length}개`]].forEach(([name,value])=>{const box=el('div','stat');box.append(el('div','stat-label',name),el('div','stat-val',value));stats.append(box)});end.append(stats);
  const review=el('div','review');review.append(el('h3',null,'문항별 결과'));state.results.forEach((r,i)=>{const row=el('div','reviewrow');row.append(el('span','idx',pad(i+1)),el('span','prompt',r.text),el('span','tag '+(r.correct?'':'fail'),r.correct?'정답':'오답'));review.append(row)});end.append(review);
  const buttons=el('div','end-buttons');buttons.append(makeButton('다시 응시하기','btn-primary',()=>{reset();begin();window.scrollTo({top:0,behavior:'smooth'})}),makeButton('결과 복사하기','btn-subtle',async()=>{const msg=`온리리온 능력 평가 시험 결과: ${percent}점 (${state.score}/${QUESTIONS.length}문항 정답) · ${g[0]} · 소요 시간 ${formattedTime()}`;try{await navigator.clipboard.writeText(msg);toast('결과를 복사했습니다.')}catch(e){const t=document.createElement('textarea');t.value=msg;document.body.append(t);t.select();try{document.execCommand('copy');toast('결과를 복사했습니다.')}catch(err){toast('복사할 수 없습니다.')}t.remove()}}));end.append(buttons);paper.append(end)}
async function shareLink(){const link=location.href.split('#')[0].split('?')[0];try{await navigator.clipboard.writeText(link);toast('시험 링크를 복사했습니다.')}catch(e){const t=document.createElement('textarea');t.value=link;document.body.append(t);t.select();if(document.execCommand('copy'))toast('시험 링크를 복사했습니다.');else toast('주소창의 링크를 복사해 주세요.');t.remove()}}
function toast(message){let t=document.getElementById('olat-toast');if(!t){t=el('div');t.id='olat-toast';t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 18px;border-radius:9px;background:#26303b;color:white;box-shadow:0 5px 20px #0002;z-index:20;font-size:13px;font-weight:700;text-align:center;max-width:90vw';document.body.append(t)}t.textContent=message;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.remove(),2500)}
renderStart();
</script>
